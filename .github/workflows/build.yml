# Builds MixMedia on Windows and Linux every time you push and runs the tests.
#
# Making a release: tag a version and push the tag, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# Everything gets packaged (Windows installer + zip, Linux AppImage + tar.gz) and attached to a new release.
# "Run workflow" on the Actions page also packages them, without making a release.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Only docs or pictures changed? Nothing to build. (Tags always build.)
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "*.png"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "*.png"]
  workflow_dispatch: # adds a "Run workflow" button on GitHub

# Pushed again before the last run finished? Stop the old one, it's out of date anyway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Only bother making the zip and AppImage for releases and manual runs
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7

      # MSYS2 gives us the same GCC + Qt + FFmpeg setup we use on Linux.
      # The downloaded packages are cached, so after the first run this is much quicker.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ffmpeg

      # Remembers compiled files between runs, so only what changed gets rebuilt
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build
          ccache --show-stats --verbose | head -5 || true

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Bundle everything it needs
        if: env.PACKAGE == 'true'
        run: cmake --install build --prefix MixMedia

      - name: Zip it up
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: Compress-Archive -Path MixMedia -DestinationPath MixMedia-Windows-x64.zip

      # A proper installer too: Start menu, desktop shortcut, uninstaller. Everything's packed inside.
      - name: Make the installer
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(MixMedia VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\MixMedia" packaging\windows\mixmedia.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        if: env.PACKAGE == 'true'
        with:
          name: MixMedia-Windows
          path: |
            MixMedia-Windows-x64.zip
            MixMedia-Setup-x64.exe

  linux:
    runs-on: ubuntu-latest
    # Fedora has new enough Qt and FFmpeg (with RPM Fusion for the full codecs)
    container: fedora:latest
    env:
      CCACHE_DIR: /__w/ccache
    steps:
      # The cache needs tar and zstd, which a bare Fedora container might not have
      - name: Get ready
        run: dnf install -y --setopt=install_weak_deps=False tar zstd

      # Downloaded packages are kept between runs too
      - uses: actions/cache@v6
        with:
          path: /var/cache/libdnf5
          key: dnf-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dnf-${{ runner.os }}-

      - name: Install tools
        run: |
          # keepcache = hang on to downloads for next time,
          # install_weak_deps=False = skip the optional extras (cuts the download a lot)
          opts="-y --setopt=keepcache=True --setopt=install_weak_deps=False"
          dnf install $opts https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
          dnf install $opts git gcc-c++ cmake ninja-build ccache file findutils zstd \
            qt6-qtbase-devel qt6-qtmultimedia-devel ffmpeg-devel

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: /__w/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build
          ccache --show-stats | head -5 || true

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Linux downloads get built on an older, steady Ubuntu, with the official Qt and
  # our own trimmed-down FFmpeg. That way they run on most distros from about 2022 on,
  # and the AppImage tools (which are made for this setup) don't trip over anything.
  linux-package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      FFMPEG_VERSION: "8.1.3"
      FFMPEG_PREFIX: ${{ github.workspace }}/ffmpeg
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nasm pkg-config gcc-12 g++-12 \
            libx264-dev libdav1d-dev libva-dev libdrm-dev zlib1g-dev \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libpulse-dev libfuse2 file \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # FFmpeg with just what a video editor needs (no network stuff dragging in Samba and friends)
      - uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-ubuntu22-v1

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz | tar xJ
          cd ffmpeg-$FFMPEG_VERSION
          ./configure --prefix="$FFMPEG_PREFIX" --enable-shared --disable-static \
            --enable-gpl --enable-libx264 --enable-libdav1d --enable-vaapi --enable-libdrm --enable-zlib \
            --disable-programs --disable-doc --disable-network --disable-autodetect
          make -j$(nproc)
          make install

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          modules: qtmultimedia
          cache: true

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.FFMPEG_PREFIX }}/lib
        run: ctest --test-dir build --output-on-failure

      # AppImage = one file you run. The tar.gz is the same thing as a plain folder.
      - name: Make the AppImage and the tar.gz
        env:
          LD_LIBRARY_PATH: ${{ env.FFMPEG_PREFIX }}/lib
          LDAI_OUTPUT: MixMedia-Linux-x86_64.AppImage
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so # lets the app start without a screen (used by the smoke test)
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          DESTDIR=AppDir cmake --install build
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/mixmedia \
            --desktop-file packaging/mixmedia.desktop \
            --icon-file packaging/mixmedia.png \
            --plugin qt --output appimage

          # Same files as a folder, with a "mixmedia" to double-click at the top
          mv AppDir MixMedia
          ln -s usr/bin/mixmedia MixMedia/mixmedia
          cp packaging/linux/README.txt MixMedia/
          tar czf MixMedia-Linux-x86_64.tar.gz MixMedia

      # Make sure what we just made actually starts (no screen needed for this)
      - name: Smoke test
        run: |
          ./MixMedia-Linux-x86_64.AppImage --appimage-extract >/dev/null
          QT_QPA_PLATFORM=offscreen timeout 10 ./squashfs-root/AppRun & pid=$!
          sleep 6
          kill -0 $pid && echo "AppImage starts fine"
          kill $pid || true

      - uses: actions/upload-artifact@v7
        with:
          name: MixMedia-Linux
          path: |
            MixMedia-Linux-x86_64.AppImage
            MixMedia-Linux-x86_64.tar.gz

  # Only for version tags: put all the downloads on a new release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Made the release by hand on GitHub already? Then just add the files to it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "MixMedia $GITHUB_REF_NAME" \
              --generate-notes
          fi
